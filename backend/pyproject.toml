[project]
name = "pianke"
version = "0.1.0"
description = "片刻：只推荐三部，每一部都懂你。本机运行的 Spark-X2.5 观影推荐。"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sse-starlette>=2.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "rapidfuzz>=3.0",
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pianke*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
